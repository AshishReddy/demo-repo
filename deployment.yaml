apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  name: system:openshift:scc:anyuid
rules: null
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  selector:
    matchLabels:
      app: nginx
  replicas: 2 # tells deployment to run 2 pods matching the template
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      serviceAccount: nginx-sa
      serviceAccountName: nginx-sa
      - name: nginx
        ports:
        - containerPort: 80
